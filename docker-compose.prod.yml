services:
  simstudio:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: sim2/simstudio:node22
    restart: unless-stopped
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: 8G
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # TRUSTED_ORIGINS: comma-separated public origins to trust for auth in
      # addition to NEXT_PUBLIC_APP_URL. Use when serving from multiple domains
      # (apex + www, alias hostnames, reverse-proxy IPs). Empty by default.
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # AUTH_TRUSTED_PROXIES: comma-separated reverse-proxy IPs or CIDR ranges in
      # front of the app (ingress, load balancer). Better Auth walks
      # x-forwarded-for right to left, skips these hops, and uses the first
      # untrusted address as the client IP. Required for correct session IPs and
      # rate-limit keying behind a multi-hop proxy chain. Empty by default.
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
      - SIM_AGENT_API_URL=${SIM_AGENT_API_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - SOCKET_SERVER_URL=${SOCKET_SERVER_URL:-http://realtime:3002}
      # NEXT_PUBLIC_SOCKET_URL is read by the browser. Leave it unset for this
      # stack: the client already falls back to localhost:3002 for a localhost
      # page, and a proxied deployment needs the page-origin fallback that an
      # explicit value would suppress. Set it only when realtime is on a
      # different host:port (e.g. wss://socket.example.com).
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-}
      - ADMISSION_GATE_MAX_INFLIGHT=${ADMISSION_GATE_MAX_INFLIGHT:-500}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  workspace-gateway:
    build:
      context: .
      dockerfile: docker/workspace-gateway.Dockerfile
    restart: unless-stopped
    ports:
      - '3000:8080'
    environment:
      # Set to 0 only after Home and Editor equivalence/SLA evidence passes.
      - WORKSPACE_NEXT_FALLBACK=${WORKSPACE_NEXT_FALLBACK:-1}
    depends_on:
      simstudio:
        condition: service_healthy
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SIM_SERVICE: api
    restart: unless-stopped
    expose:
      - '3012'
    environment:
      - NODE_ENV=production
      - API_PORT=3012
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://workspace-gateway:8080}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - SIM_LEGACY_API_BASE_URL=http://simstudio:3000
      - WORKER_ADMISSION_URL=http://worker:3013
      - INTERNAL_EXECUTION_TOKEN=${INTERNAL_EXECUTION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3012/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SIM_SERVICE: worker
    restart: unless-stopped
    expose:
      - '3013'
    environment:
      - NODE_ENV=production
      - WORKER_PORT=3013
      - INTERNAL_EXECUTION_TOKEN=${INTERNAL_EXECUTION_TOKEN:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3013/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  realtime:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    image: sim2/realtime:node22
    restart: unless-stopped
    expose:
      - '3002'
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/health']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'

  # Backs pub/sub (live Chat task-status and table events) and the shared caches.
  # The app falls back to PostgreSQL for storage when REDIS_URL is unset, but the
  # pub/sub channels have no fallback — without Redis, live status never streams.
  # Not published to the host: only the app and realtime containers need it, and
  # binding 6379 would collide with a Redis already running locally.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simstudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
