map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map "${WORKSPACE_NEXT_FALLBACK}:$arg_runtime" $workspace_next_fallback {
  default 0;
  "1:next" 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /api/workspace-bootstrap {
    proxy_pass http://api:3012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://simstudio:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ingest/ {
    proxy_pass http://simstudio:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://realtime:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location ~ ^/workspace/[^/]+/(home|w/[^/]+)/?$ {
    error_page 418 = @next_workspace;
    if ($workspace_next_fallback) {
      return 418;
    }
    try_files /index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    proxy_pass http://simstudio:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @next_workspace {
    proxy_pass http://simstudio:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
